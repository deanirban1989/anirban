name: Publish Security Domains series
on:
  push:
    branches: [views/publish-security-domains]
    paths: [editorial/security-domains.json]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update published articles
        env:
          WRITER_KEY: ${{ secrets.SUPABASE_SNAPSHOT_WRITER_KEY }}
        run: |
          node <<'JS'
          const rows = require('./editorial/security-domains.json');
          if (!process.env.WRITER_KEY || rows.length !== 15) process.exit(1);
          fetch('https://vpvwpcoctjuejaclqger.supabase.co/rest/v1/site_articles?on_conflict=slug', {
            method: 'POST',
            headers: {
              apikey: process.env.WRITER_KEY,
              'Content-Type': 'application/json',
              Prefer: 'resolution=merge-duplicates'
            },
            body: JSON.stringify(rows),
            signal: AbortSignal.timeout(15000)
          }).then(response => {
            console.log('Article update HTTP status:', response.status);
            if (!response.ok) process.exitCode = 1;
          }).catch(() => { process.exitCode = 1; });
          JS
