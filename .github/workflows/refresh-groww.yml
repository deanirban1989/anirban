name: Refresh Groww holdings

on:
  schedule:
    - cron: '37 16 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: groww-production-refresh

jobs:
  refresh:
    if: github.ref == 'refs/heads/claude/personal-portfolio-site-0nac31'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public company list
        env:
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
        run: node .github/scripts/refresh-groww.mjs
      - name: Publish updated company list
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo 'Set the VERCEL_DEPLOY_HOOK repository secret to publish the refresh.'
            exit 1
          fi
          if ! git diff --quiet -- investments/india.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add investments/india.json
            git commit -m 'Refresh Indian company investments'
            git push
          fi
          curl --fail --silent --show-error --max-time 20 --output /dev/null --request POST "$VERCEL_DEPLOY_HOOK"
